; Copy to config.ini (next to the script) or ~/.config/anubis-cookie/config.ini,
; or point $ANUBIS_COOKIE_CONFIG at it.

[anubis-cookie]
; GitLab host used when no host is given on the command line.
host = gitlab.example.com

; User-Agent used to solve the challenge. The cookie is bound to it, so glab must
; send the same one: use `valueFromCommand: anubis-cookie --user-agent` in glab's config.
user_agent = glab-cli anubis-cookie/1.0
